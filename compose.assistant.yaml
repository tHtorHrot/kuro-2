# Opt-in AI overlay; premium budget is zero in the default setup.
x-assistant-app: &assistant-app
  image: personal-jarvis:0.4.0
  build:
    context: .
    target: runtime
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=16m,mode=1777
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  pids_limit: 100
  mem_limit: 384m
  cpus: 0.5
  environment:
    JARVIS_ENVIRONMENT: production
    JARVIS_DATABASE_URL_FILE: /run/secrets/database_url
    JARVIS_TOKEN_PEPPER_FILE: /run/secrets/token_pepper
    JARVIS_ASSISTANT_CONFIG_FILE: /run/secrets/assistant_config
    LANGSMITH_TRACING: 'false'
    LANGCHAIN_TRACING_V2: 'false'
  networks: [database]
  secrets: [database_url, token_pepper, assistant_config]
  entrypoint: [jarvis]
  logging:
    driver: json-file
    options:
      max-size: '5m'
      max-file: '3'

services:
  assistant:
    <<: *assistant-app
    profiles: [assistant]
    restart: 'on-failure:5'
    stop_grace_period: 100s
    command: [assistant-run]
    environment:
      JARVIS_ENVIRONMENT: production
      JARVIS_DATABASE_URL_FILE: /run/secrets/database_url
      JARVIS_TOKEN_PEPPER_FILE: /run/secrets/token_pepper
      JARVIS_ASSISTANT_CONFIG_FILE: /run/secrets/assistant_config
      JARVIS_OPENROUTER_KEY_FILE: /run/secrets/openrouter_key
      LANGSMITH_TRACING: 'false'
      LANGCHAIN_TRACING_V2: 'false'
    secrets: [database_url, token_pepper, assistant_config, openrouter_key]
    networks: [database, assistant_egress]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, jarvis, assistant-health]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
  assistant-ops:
    <<: *assistant-app
    profiles: [assistant-ops]
    restart: 'no'
    command: [assistant-status]
  assistant-catalog:
    <<: *assistant-app
    profiles: [assistant-ops]
    restart: 'no'
    command: [assistant-catalog]
    environment:
      JARVIS_ENVIRONMENT: production
      JARVIS_DATABASE_URL_FILE: /run/secrets/database_url
      JARVIS_TOKEN_PEPPER_FILE: /run/secrets/token_pepper
      JARVIS_ASSISTANT_CONFIG_FILE: /run/secrets/assistant_config
      JARVIS_OPENROUTER_KEY_FILE: /run/secrets/openrouter_key
    secrets: [database_url, token_pepper, assistant_config, openrouter_key]
    networks: [database, assistant_egress]

networks:
  assistant_egress:
    driver: bridge

secrets:
  assistant_config:
    file: ./.secrets/assistant_config.json
  openrouter_key:
    file: ./.secrets/openrouter_key
