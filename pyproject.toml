[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "personal-jarvis"
version = "0.4.0"
description = "Private Jarvis foundation and durable owner-bound Telegram transport"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.121,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0.36,<2.1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "prometheus-client>=0.21,<1",
  "httpx>=0.28,<0.29",
  "langgraph>=1.0,<2",
  "fastembed>=0.7,<1",
  "pillow>=11,<13",
  "defusedxml>=0.7,<1",
]

[project.scripts]
jarvis = "jarvis.cli:main"

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
  "pip-audit>=2.9,<3",
  "pyyaml>=6,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: requires an isolated PostgreSQL database"]
addopts = "-ra"

[tool.coverage.run]
source = ["jarvis"]
branch = true

[tool.coverage.report]
show_missing = true
