name: Jarvis foundation, Telegram and assistant checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.14'
      - run: python -m pip install uv==0.12.18
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-eng tesseract-ocr-ind fonts-dejavu-core
      - run: uv run pytest tests/unit tests/offline
      - run: uv export --frozen --no-dev --no-emit-project -o /tmp/jarvis-runtime-requirements.txt
      - run: uv run pip-audit --strict --disable-pip -r /tmp/jarvis-runtime-requirements.txt
  postgres-and-docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: docker compose -f compose.test.yaml up --build --abort-on-container-exit --exit-code-from tests
      - if: always()
        run: docker compose -f compose.test.yaml down --volumes
      - name: Runtime container smoke check
        run: |
          python3 scripts/setup_local.py
          docker compose up -d --build --wait --wait-timeout 180 api
          docker compose --profile ops run --rm --no-deps ops doctor
          test "$(docker compose port api 8000)" = "127.0.0.1:8000"
          curl --noproxy '*' --connect-timeout 5 --max-time 10 --fail http://127.0.0.1:8000/health/ready
      - if: always()
        run: docker compose down --volumes
  windows-credential-generation:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.18
      - run: uv sync --frozen
      - run: uv run pytest tests/unit/test_documents_cli.py
      - run: uv run pytest tests/unit/test_windows_secrets.py tests/unit/test_telegram_setup.py tests/unit/test_assistant_graph_setup.py -k "generator_uses_portable_newlines or setup_rolls_back or binary_backup"
